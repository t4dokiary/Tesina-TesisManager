{% extends 'seguimiento/base.html' %}
{% block title %}Enlace Inválido — FCC BUAP{% endblock %}

{% block content %}
<div class="row justify-content-center mt-4">
    <div class="col-md-5 text-center">
        <div class="card shadow-sm border-0 p-4">
            <i class="bi bi-shield-slash-fill text-danger fs-1 mb-2"></i>
            <h5 class="fw-bold text-danger">Enlace Expirado o Inválido</h5>
            <p class="text-muted small">Este enlace de seguridad ya superó el tiempo límite de 1 hora o ya fue utilizado anteriormente.</p>
            <div>
                <a href="{% url 'recuperar' %}" class="btn btn-buap btn-sm px-4">Solicitar uno nuevo</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
